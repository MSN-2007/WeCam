name: Release Extension Package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build extension packages
        id: package
        run: |
          ./scripts/package.sh
          VERSION="$(jq -r .version manifest.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/camu-autopass-chrome-v${{ steps.package.outputs.version }}.zip
            dist/camu-autopass-firefox-v${{ steps.package.outputs.version }}.zip
            dist/camu-autopass-v${{ steps.package.outputs.version }}.zip
          generate_release_notes: true
